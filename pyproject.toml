[project]
name = "eval-evolve"
version = "0.1.0"
description = "LLM evals built and improved by an agent driven by human-filed issues. Humans never touch code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lm-eval>=0.4.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
