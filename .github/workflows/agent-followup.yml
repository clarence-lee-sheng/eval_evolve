name: agent-followup

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  followup:
    # Only fire on agent-authored PRs (branch prefix `agent/`), and ignore the bot's own comments.
    if: >
      (github.event_name == 'pull_request_review' &&
       startsWith(github.event.pull_request.head.ref, 'agent/')) ||
      (github.event_name == 'pull_request_review_comment' &&
       startsWith(github.event.pull_request.head.ref, 'agent/')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       !contains(github.event.comment.user.login, 'claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve PR branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            branch=$(gh pr view ${{ github.event.issue.number }} --json headRefName --jq .headRefName)
            number=${{ github.event.issue.number }}
          else
            branch="${{ github.event.pull_request.head.ref }}"
            number=${{ github.event.pull_request.number }}
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Skip if not an agent branch
        if: ${{ !startsWith(steps.pr.outputs.branch, 'agent/') }}
        run: |
          echo "PR branch '${{ steps.pr.outputs.branch }}' is not an agent branch. Skipping."
          exit 0

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python and install deps
        run: |
          uv python install 3.12
          uv sync

      - name: Run agent followup
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--allowedTools Read,Edit,Write,Glob,Grep,Bash --max-turns 20"
          prompt: |
            You are the eval_evolve agent, iterating on an existing PR after human review.
            Read `agent/prompts/system.md` first — your standing rules apply.

            PR #${{ steps.pr.outputs.number }} on branch `${{ steps.pr.outputs.branch }}`.

            Treat all human review comments on this PR as direct intent.

            ## Steps

            1. Use `gh pr view ${{ steps.pr.outputs.number }} --comments` and
               `gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/comments`
               to read every human comment (skip your own).
            2. Make the requested changes. Stay inside `tasks/`.
            3. Re-verify if the change is non-trivial.
            4. Commit with a short imperative message and push.
            5. Post a brief reply on the PR summarizing what you changed.
            6. Do not merge.
